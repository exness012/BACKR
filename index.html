<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BACKR - Crypto Crowdfunding</title>
    <meta name="description" content="Next-generation crypto crowdfunding platform powered by Solana Devnet with transparent on-chain milestone tracking and funding ledgers." />
    <meta property="og:title" content="BACKR - Crypto Crowdfunding" />
    <meta property="og:description" content="Next-generation crypto crowdfunding platform powered by Solana Devnet with transparent on-chain milestone tracking and funding ledgers." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta property="og:image" content="/logo.png" />
    <script>
      (function() {
        try {
          var origDef = Object.defineProperty;
          Object.defineProperty = function(obj, prop, desc) {
            try {
              return origDef.call(Object, obj, prop, desc);
            } catch (err) {
              if ((obj === window || obj === globalThis) && (prop === 'ethereum' || prop === 'solana')) {
                try {
                  if (desc && 'value' in desc) {
                    obj[prop] = desc.value;
                  }
                } catch (e) {}
                return obj;
              }
              throw err;
            }
          };
        } catch (e) {}

        window.addEventListener('error', function(e) {
          if (
            e && (
              (e.message && (e.message.indexOf('ethereum') !== -1 || e.message.indexOf('Cannot redefine property') !== -1)) ||
              (e.filename && (e.filename.indexOf('chrome-extension://') !== -1 || e.filename.indexOf('moz-extension://') !== -1))
            )
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
